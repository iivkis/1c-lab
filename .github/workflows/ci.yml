name: BSL syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bsl-syntax:
    name: Check BSL syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require BSL sources
        shell: bash
        run: |
          if [[ ! -d src ]] || ! find src -type f -name '*.bsl' -print -quit | grep -q .; then
            echo '::error::No .bsl files under src/. Push source code first.'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned BSL Language Server v1.0.7
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/1c-syntax/bsl-language-server/releases/download/v1.0.7/bsl-language-server-1.0.7-exec.jar' \
            --output bsl-language-server.jar
          echo '9f62765edd344d66456da24c906eaf623a03c56e90e5aafee466200100909f64  bsl-language-server.jar' | sha256sum --check
      - name: Check 1C metadata XML structure
        run: python3 scripts/check-metadata.py src
      - name: Run all source and validation-script regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Check syntax of src/**/*.bsl
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bsl-report"
          java -Xmx2g -jar bsl-language-server.jar analyze \
            --srcDir src --reporter json --outputDir "$RUNNER_TEMP/bsl-report"
          python3 scripts/check-bsl-report.py "$RUNNER_TEMP/bsl-report/bsl-json.json" src
