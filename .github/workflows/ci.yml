name: Verify 1C .dt with educational platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Require DT and real 1C CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Reject missing DT or disabled platform validation
        shell: bash
        env:
          ONEC_TRAINING_CI: ${{ vars.ONEC_TRAINING_CI }}
        run: |
          set -euo pipefail
          if [[ ! -f artifacts/warehouse.dt ]]; then
            echo "::error::No artifacts/warehouse.dt in the repository. Cannot validate 1C."
            exit 1
          fi
          if [[ "$ONEC_TRAINING_CI" != "true" ]]; then
            echo "::error::Educational 1C validation is not configured. Install 1cv8t on a self-hosted Linux x64 runner (label: onec-training), then set ONEC_TRAINING_CI=true."
            exit 1
          fi

  validate-dt:
    name: Restore, compile and verify DT in educational 1C
    needs: preflight
    # The real 1C check runs only on trusted main, never on untrusted pull requests.
    runs-on: [self-hosted, linux, x64, onec-training]
    timeout-minutes: 45
    env:
      ONEC_TRAINING_BIN: ${{ vars.ONEC_TRAINING_BIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Retrieve actual DT from Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
      - name: Check restored database and configuration via 1cv8t
        shell: bash
        run: bash scripts/validate-dt.sh artifacts/warehouse.dt
